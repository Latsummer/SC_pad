<h1>SCMDB 公开页面采集助手</h1>
<p>把下方按钮拖到浏览器收藏栏。它只读取 Fabricator 页面已经渲染出来的蓝图卡片，不直接访问 <code>/data/</code>。</p>

ion%20captureVisibleCards()%20{%0A%20%20%20%20if%20(paused)%20return;%0A%20%20%20%20const%20candidates%20=%20[...document.querySelectorAll(%22main%20*,%20%23app%20*,%20%23root%20*%22)];%0A%20%20%20%20candidates.forEach((element)%20=%3E%20{%0A%20%20%20%20%20%20const%20text%20=%20compact(element.innerText%20||%20%22%22);%0A%20%20%20%20%20%20if%20(!looksLikeBlueprintCard(text))%20return;%0A%20%20%20%20%20%20const%20key%20=%20hash(text);%0A%20%20%20%20%20%20if%20(!records.has(key))%20{%0A%20%20%20%20%20%20%20%20records.set(key,%20{%20raw_text:%20text,%20captured_at:%20new%20Date().toISOString()%20});%0A%20%20%20%20%20%20}%0A%20%20%20%20});%0A%20%20%20%20count.textContent%20=%20%60%24{records.size}%20%E6%9D%A1%E5%B7%B2%E8%AE%B0%E5%BD%95%60;%0A%20%20%20%20exportButton.textContent%20=%20%60%E5%AF%BC%E5%87%BA%20%24{records.size}%20%E6%9D%A1%60;%0A%20%20}%0A%0A%20%20function%20scheduleCapture()%20{%0A%20%20%20%20window.clearTimeout(captureTimer);%0A%20%20%20%20captureTimer%20=%20window.setTimeout(captureVisibleCards,%20160);%0A%20%20}%0A%0A%20%20const%20panel%20=%20document.createElement(%22section%22);%0A%20%20panel.setAttribute(%22aria-label%22,%20%22SCMDB%20%E5%85%AC%E5%BC%80%E9%A1%B5%E9%9D%A2%E9%87%87%E9%9B%86%E5%8A%A9%E6%89%8B%22);%0A%20%20panel.style.cssText%20=%20[%0A%20%20%20%20%22position:fixed%22,%20%22right:16px%22,%20%22bottom:16px%22,%20%22z-index:2147483647%22,%0A%20%20%20%20%22width:min(310px,calc(100vw%20-%2032px))%22,%20%22padding:14px%22,%20%22border:1px%20solid%20%2335d9e8%22,%0A%20%20%20%20%22border-radius:12px%22,%20%22background:%23071114%22,%20%22color:%23e8f6f7%22,%20%22box-shadow:0%2012px%2034px%20rgba(0,0,0,.45)%22,%0A%20%20%20%20%22font:13px%20system-ui,-apple-system,BlinkMacSystemFont,'Segoe%20UI',sans-serif%22,%0A%20%20].join(%22;%22);%0A%20%20panel.innerHTML%20=%20%60%0A%20%20%20%20%3Cstrong%20style=%22display:block;margin-bottom:6px;color:%2335d9e8%22%3ESCMDB%20%E5%85%AC%E5%BC%80%E9%A1%B5%E9%9D%A2%E9%87%87%E9%9B%86%3C/strong%3E%0A%20%20%20%20%3 <ol><li>打开 SCMDB 的 Fabricator 页面，等待列表出现。</li><li>点击收藏栏中的“启动 SCMDB 采集”。</li><li>缓慢滚到底部，让页面逐段显示蓝图；右下角会显示已记录数量。</li><li>点击“导出”，把下载的 JSON 放入项目后交给导入器处理。</li></ol>
