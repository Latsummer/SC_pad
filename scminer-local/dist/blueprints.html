<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071114">
    <meta name="description" content="离线 Star Citizen 制造蓝图与矿物材料查询工具">
    <title>制造蓝图 · 矿物导航台</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="返回矿物导航台">
          <span class="brand-mark" aria-hidden="true">◇</span>
          <span><strong>矿物导航台</strong><small>SC MINING ATLAS</small></span>
        </a>
        <div class="topbar-actions">
          <a class="nav-link active" href="blueprints.html">制造蓝图</a>
          <div class="dataset-meta"><span class="status-dot" aria-hidden="true"></span><span id="blueprintVersion">蓝图数据载入中</span></div>
        </div>
      </header>

      <main class="blueprint-page">
        <section class="blueprint-hero" aria-labelledby="blueprintTitle">
          <p class="eyebrow">OFFLINE FABRICATOR INDEX</p>
          <h1 id="blueprintTitle">制造什么，<em>需要哪些矿？</em></h1>
          <p>按蓝图、材料、槽位和尺寸筛选。材料多选时，结果必须同时包含所有选中的材料。</p>
        </section>

        <section class="blueprint-controls panel" aria-label="蓝图筛选">
          <div class="blueprint-primary-row">
            <div class="blueprint-search-wrap">
              <label for="blueprintSearch">搜索蓝图名称</label>
              <input id="blueprintSearch" type="search" placeholder="例如：探测器、推进器、牵引光束" autocomplete="off">
            </div>
            <button id="openBlueprintFilters" class="filter-drawer-trigger" type="button" aria-controls="blueprintFilterDrawer" aria-expanded="false">筛选</button>
          </div>
          <div id="activeBlueprintFilters" class="active-blueprint-filters" aria-label="已启用的筛选条件"></div>
          <button id="blueprintFilterBackdrop" class="filter-drawer-backdrop" type="button" aria-label="关闭筛选" tabindex="-1"></button>
          <div id="blueprintFilterDrawer" class="blueprint-filter-drawer" role="dialog" aria-modal="true" aria-labelledby="blueprintFilterTitle">
            <div class="filter-drawer-head">
              <h2 id="blueprintFilterTitle">筛选条件</h2>
              <button id="closeBlueprintFilters" type="button" aria-label="关闭筛选">×</button>
            </div>
            <div class="material-picker">
              <label for="materialSearch">按矿物筛选（可多选）</label>
              <input id="materialSearch" type="search" placeholder="输入中文或英文矿物名" autocomplete="off" aria-controls="materialSuggestions" aria-expanded="false">
              <div id="materialSuggestions" class="suggestions material-suggestions" hidden></div>
              <div id="selectedMaterials" class="selected-minerals blueprint-chips"></div>
            </div>
            <div class="blueprint-selects">
              <label>制造大类<select id="typeFilter"><option value="all">全部大类</option></select></label>
              <label>细分类型<select id="subtypeFilter"><option value="all">全部细分</option></select></label>
              <label>材料槽位<select id="slotFilter"><option value="all">全部槽位</option></select></label>
              <label>尺寸<select id="sizeFilter"><option value="all">全部尺寸</option></select></label>
            </div>
            <div class="filter-drawer-actions">
              <button id="resetBlueprintFilters" class="text-button blueprint-reset" type="button">重置筛选</button>
              <button id="applyBlueprintFilters" class="primary-button filter-apply" type="button">查看结果</button>
            </div>
          </div>
        </section>

        <section class="blueprint-results-section">
          <div id="blueprintSummary" class="summary-bar"></div>
          <div id="blueprintResults" class="blueprint-results"></div>
        </section>
      </main>
    </div>
    <script src="app-data.js"></script>
    <script src="blueprints-data.js"></script>
    <script src="blueprint-locale.js"></script>
    <script src="blueprints.js"></script>
    <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", {scope:"./"}).catch(() => {}));</script>
  </body>
</html>
