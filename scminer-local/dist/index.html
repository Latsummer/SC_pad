<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="离线 Star Citizen 矿物、扫描特征与分布查询工具">
    <meta name="theme-color" content="#071114">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="矿物导航台">
    <title>矿物导航台 · SC Mining Atlas</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="矿物导航台首页">
          <span class="brand-mark" aria-hidden="true">◇</span>
          <span><strong>矿物导航台</strong><small>SC MINING ATLAS</small></span>
        </a>
        <div class="dataset-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="versionLabel">数据载入中</span>
        </div>
      </header>

      <main>
        <section class="command-deck" aria-labelledby="workspaceTitle">
          <div class="deck-heading">
            <div>
              <p class="eyebrow">LOCAL PROSPECTING CONSOLE</p>
              <h1 id="workspaceTitle">今天要找什么矿？</h1>
            </div>
            <div class="mode-switch" role="tablist" aria-label="查询模式">
              <button class="mode-button active" type="button" role="tab" aria-selected="true" data-mode="mineral">矿物与分布</button>
              <button class="mode-button" type="button" role="tab" aria-selected="false" data-mode="scan">扫描值反查</button>
            </div>
          </div>

          <div id="mineralControls" class="mineral-controls">
            <div class="search-wrap">
              <label for="mineralSearch">选择矿物，或搜索中文、英文和别名</label>
              <div class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="mineralSearch" type="search" autocomplete="off" placeholder="点击选择，或输入矿物名称" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
                <button id="mineralDropdownToggle" class="dropdown-toggle" type="button" aria-label="展开矿物列表" aria-controls="suggestions" aria-expanded="false"><span aria-hidden="true">⌄</span></button>
              </div>
              <div id="suggestions" class="suggestions" role="listbox" aria-label="可选矿物" hidden></div>
            </div>
            <div id="selectedMinerals" class="selected-minerals" aria-live="polite"></div>
          </div>

          <div id="scanControls" class="scan-controls" hidden>
            <label for="scanInput">输入驾驶舱扫描信号</label>
            <div class="scan-entry">
              <input id="scanInput" type="number" min="1" inputmode="numeric" placeholder="例如：3585">
              <button id="scanButton" class="primary-button" type="button">识别矿石</button>
            </div>
            <p>输入后实时识别，也可点击按钮或按回车手动查询。计算规则：单块特征值 × 同类矿石数量；信号冲突时会列出全部候选。</p>
          </div>
        </section>

        <section id="mineralWorkspace" class="workspace-grid">
          <aside class="filter-panel panel" aria-label="结果筛选">
            <div class="panel-title-row">
              <h2>筛选</h2>
              <button id="resetFilters" class="text-button" type="button">重置</button>
            </div>
            <fieldset>
              <legend><span>星系</span><small>匹配地点数</small></legend>
              <div id="systemFilters" class="filter-list"></div>
            </fieldset>
            <fieldset>
              <legend><span>采矿方式</span><small>匹配地点数</small></legend>
              <div id="methodFilters" class="filter-list"></div>
            </fieldset>
            <div class="ranking-note">
              <span aria-hidden="true">↗</span>
              <p>多矿结果优先考虑所有目标矿中最低的丰度，避免某一种矿物特别稀少。</p>
            </div>
          </aside>

          <section class="results-column">
            <div id="summaryBar" class="summary-bar"></div>
            <div id="locationResults" class="location-results"></div>
          </section>

          <aside id="mineralDetails" class="detail-column" aria-label="矿物详情"></aside>
        </section>

        <section id="scanWorkspace" class="scan-workspace" hidden>
          <div id="scanResults" class="scan-results panel">
            <div class="empty-state">
              <span class="empty-glyph" aria-hidden="true">◎</span>
              <h2>等待扫描信号</h2>
              <p>输入一个正整数，即可反推出可能的矿石种类和岩石数量。</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app-data.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
      }
    </script>
  </body>
</html>
