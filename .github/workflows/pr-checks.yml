name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python3 -m compileall -q tools
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scminer-local/dist/*.js tools/scmdb_public_capture.js tools/scmdb_missions_capture.js erkul-calculator-zh.user.js; do
            node --check "$file"
          done
      - name: Validate site data and generated files
        id: site_check
        run: python3 tools/check_scminer_site.py
      - name: Check blueprint translation regressions
        run: python3 tools/test_scmdb_locale.py
      - name: Check mission capture, translation and data regressions
        run: |
          python3 tools/test_archive_mission_capture.py
          python3 tools/test_game_locale.py
          python3 tools/test_mission_translation.py
          python3 tools/test_mission_site_data.py
          node tools/test_scmdb_missions_capture.cjs
      - name: 展示中文翻译报告
        if: always()
        env:
          CHECK_RESULT: ${{ steps.site_check.outcome }}
        run: |
          report=scminer-local/data/scmdb-blueprints.translation-report.md
          if [ -f "$report" ]; then
            if [ "$CHECK_RESULT" = success ]; then
              printf '数据与翻译一致性校验：通过。\n\n' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '数据与翻译一致性校验未通过或未执行；以下为本次提交中的报告，可能需要重新生成。\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '未找到中文翻译报告，请重新导入蓝图快照生成报告。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 上传中文翻译报告附件
        if: always() && hashFiles('scminer-local/data/scmdb-blueprints.translation-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-translation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: scminer-local/data/scmdb-blueprints.translation-report.md
          if-no-files-found: error
          retention-days: 30
