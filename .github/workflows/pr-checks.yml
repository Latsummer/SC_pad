name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python3 -m compileall -q tools
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scminer-local/dist/*.js tools/scmdb_public_capture.js erkul-calculator-zh.user.js; do
            node --check "$file"
          done
      - name: Validate site data and generated files
        run: python3 tools/check_scminer_site.py
