name: Deploy mining site

on:
  push:
    branches: [main]
    paths:
      - 'scminer-local/dist/**'
      - 'scminer-local/Makefile'
      - '.github/workflows/deploy-edgeone.yml'
      - 'tools/check_scminer_site.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment credential
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo '::error::Configure Repository secret EDGEONE_API_TOKEN to enable deployment.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site data before deployment
        run: python3 tools/check_scminer_site.py
      - name: Install EdgeOne CLI
        run: npm install --global edgeone@1.6.40
      - name: Deploy production site
        working-directory: scminer-local/dist
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: edgeone makers deploy -n scminer -a overseas -e production --skip-ai-gateway-sync --token "$EDGEONE_API_TOKEN"
